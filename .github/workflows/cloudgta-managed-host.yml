name: Build CloudGTA managed host

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  windows-host:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
      - name: Prepare dependencies
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/. /mingw64/bin
          cp -a ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/. /mingw64/include
          cp -a ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/. /mingw64/lib
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc
          scripts/build-libplacebo-windows.sh
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF
          cmake --build build --config Release --clean-first --target chiaki
      - name: Deploy runtime and self-test
        run: |
          scripts/deploy-windows-msys2.sh managed-host build/gui/cloudgta-remoteplay-host.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml
          ./managed-host/cloudgta-remoteplay-host.exe --cloudgta-host-self-test | tee self-test.jsonl
          grep -Fx '{"event":"stopped"}' self-test.jsonl
          sha256sum managed-host/cloudgta-remoteplay-host.exe > managed-host/SHA256SUMS
          zip -r cloudgta-managed-host-${{ github.sha }}.zip managed-host MANAGED-HOST.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: cloudgta-managed-host-${{ github.sha }}
          path: cloudgta-managed-host-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7
